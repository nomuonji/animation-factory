name: Shorts auto publish (guarded)

# Renders one editorial_pass production from main and uploads it PUBLIC.
# Guards (tools/shorts-publish-guard.mjs): kill switch variable AUTO_PUBLISH_ENABLED=true,
# MAX_PER_DAY public videos per JST day, no duplicate Production-ID on the channel.
# The brief must say "status": "editorial_pass" (set by the producer after reviewing the render).
# Nothing here retries an upload: an uncertain upload must be reconciled in YouTube Studio.
on:
  workflow_dispatch:
    inputs:
      production:
        description: production folder under productions/ (must be editorial_pass on main)
        required: true
      made_for_kids:
        description: Is this video made for kids? (explicit answer required by YouTube)
        required: true
        type: choice
        default: "false"
        options: ["false", "true"]

permissions:
  contents: read

concurrency:
  group: shorts-auto-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PRODUCTION: ${{ github.event.inputs.production }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY || vars.PIXABAY_API_KEY }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
      YOUTUBE_MADE_FOR_KIDS: ${{ github.event.inputs.made_for_kids }}
      AUTO_PUBLISH_ENABLED: ${{ vars.AUTO_PUBLISH_ENABLED }}
      MAX_PER_DAY: ${{ vars.AUTO_PUBLISH_MAX_PER_DAY || '3' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Brief is editorial_pass and credentials are present (names only)
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PRODUCTION" =~ ^[a-z0-9][a-z0-9-]{2,63}$ ]] || { echo "bad production id"; exit 2; }
          python - <<'PY'
          import json, os, sys
          b = json.load(open(f"productions/{os.environ['PRODUCTION']}/short.json", encoding="utf-8"))
          if b.get("status") != "editorial_pass":
              sys.exit("brief status is %r, not editorial_pass" % b.get("status"))
          if (b.get("topic") or {}).get("source") == "demo":
              sys.exit("demo briefs are never published")
          PY
          for n in YOUTUBE_CLIENT_ID YOUTUBE_CLIENT_SECRET YOUTUBE_REFRESH_TOKEN YOUTUBE_CHANNEL_ID; do
            [ -n "${!n}" ] || { echo "::error::secret $n missing"; exit 2; }
          done
      - name: Guard (kill switch, daily cap, duplicate)
        run: node tools/shorts-publish-guard.mjs "$PRODUCTION"
      - name: Media dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          pip install --quiet numpy pillow opencv-python-headless
      - name: Start VOICEVOX engine
        run: |
          docker run -d --rm --name vv -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in $(seq 1 120); do curl -fsS http://127.0.0.1:50021/version && exit 0; sleep 2; done; docker logs vv; exit 1
      - name: Lock sources and render
        run: |
          python tools/shorts/shorts.py lock "productions/$PRODUCTION/short.json"
          python tools/shorts/shorts.py render "productions/$PRODUCTION/short.json"
      - name: Technical gate
        run: |
          python - <<'PY'
          import json, os, sys
          r = json.load(open(f"outputs/shorts/{os.environ['PRODUCTION']}/report.json", encoding="utf-8"))
          if r.get("status") != "technical_pass":
              sys.exit("render is %r, not technical_pass" % r.get("status"))
          PY
      - name: Upload to YouTube (public)
        env:
          MARKET_SHORTS_UPLOAD_MODE: public_auto
          AUTO_PUBLISH_CONFIRM: editorial_pass
        shell: bash
        run: |
          set -euo pipefail
          out="outputs/shorts/$PRODUCTION"
          printf '\n\nProduction-ID: %s\n' "$PRODUCTION" >> "$out/description.txt"
          python - <<'PY'
          import json, os
          b = json.load(open(f"productions/{os.environ['PRODUCTION']}/short.json", encoding="utf-8"))
          rec = {"sourceIdeaId": b["id"], "title": b["title"], "experimentVariant": "shorts-v3-auto",
                 "rightsChecked": True, "evidenceChecked": True, "uploadStatus": "not_connected"}
          json.dump(rec, open("upload-record.json", "w", encoding="utf-8"), ensure_ascii=False)
          PY
          node tools/market-shorts-upload.mjs --mp4 "$out/video.mp4" --description "$out/description.txt" \
            --experiment upload-record.json --receipt "$RUNNER_TEMP/receipt.json" | tee "$RUNNER_TEMP/result.json"
          vid=$(python -c "import json;print(json.load(open('$RUNNER_TEMP/result.json'))['videoId'])")
          echo "Published: https://youtu.be/$vid  (production $PRODUCTION)" | tee -a "$GITHUB_STEP_SUMMARY"
