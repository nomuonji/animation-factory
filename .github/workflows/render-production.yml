name: Render production

on:
  workflow_dispatch:
    inputs:
      production:
        description: Folder name under productions/
        required: true
        default: first-animation
        type: string
  push:
    branches: [main]
    paths:
      - "productions/*/production.json"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve production
        id: resolve
        shell: bash
        env:
          MANUAL_PRODUCTION: ${{ inputs.production }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            production="$MANUAL_PRODUCTION"
          else
            mapfile -t changed < <(
              git diff --name-only HEAD^ HEAD -- 'productions/*/production.json' |
              sed -n 's#^productions/\([^/][^/]*\)/production\.json$#\1#p' |
              sort -u
            )
            if [ "${#changed[@]}" -ne 1 ]; then
              echo "Expected exactly one changed production.json, found ${#changed[@]}." >&2
              printf '%s\n' "${changed[@]}" >&2
              exit 2
            fi
            production="${changed[0]}"
          fi
          if ! [[ "$production" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Unsafe production folder: $production" >&2
            exit 2
          fi
          echo "PRODUCTION=$production" >> "$GITHUB_ENV"
          echo "production=$production" >> "$GITHUB_OUTPUT"


      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Detect TTS provider
        id: tts
        shell: bash
        run: |
          set -euo pipefail
          provider="$(node -p "require('./productions/${PRODUCTION}/production.json').audio?.tts?.provider || 'none'")"
          echo "provider=$provider" >> "$GITHUB_OUTPUT"
          echo "TTS provider: $provider"

      - uses: actions/setup-python@v5
        if: steps.tts.outputs.provider == 'piper-plus'
        with:
          python-version: "3.13"

      - name: Start VOICEVOX Engine
        if: steps.tts.outputs.provider == 'voicevox'
        shell: bash
        run: |
          set -euo pipefail
          docker pull voicevox/voicevox_engine:cpu-latest
          docker run -d --rm --name voicevox -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:50021/version >/dev/null; then
              echo "VOICEVOX ready: $(curl -fsS http://127.0.0.1:50021/version)"
              exit 0
            fi
            sleep 1
          done
          docker logs voicevox || true
          exit 1

      - name: Start VOICEVOX Nemo Engine
        if: steps.tts.outputs.provider == 'voicevox-nemo'
        shell: bash
        run: |
          set -euo pipefail
          docker pull voicevox/voicevox_nemo_engine:cpu-latest
          docker run -d --rm --name voicevox-nemo -p 127.0.0.1:50021:50021 voicevox/voicevox_nemo_engine:cpu-latest
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:50021/version >/dev/null; then
              echo "VOICEVOX Nemo ready: $(curl -fsS http://127.0.0.1:50021/version)"
              exit 0
            fi
            sleep 1
          done
          docker logs voicevox-nemo || true
          exit 1

      - name: Install Japanese neural TTS
        if: steps.tts.outputs.provider == 'piper-plus'
        run: |
          python -m pip install --upgrade pip
          python -m pip install "piper-plus>=1.13,<2"
          python - <<'PY'
          import nltk
          for resource in ("averaged_perceptron_tagger_eng", "cmudict"):
              nltk.download(resource, quiet=True)
          PY
          python -m piper --download-model tsukuyomi
          test -s tsukuyomi-chan-6lang-fp16.onnx
          test -s config.json

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Install FFmpeg and Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk espeak-ng

      - name: Validate production input
        shell: bash
        run: |
          set -euo pipefail
          production="$PRODUCTION"
          if ! [[ "$production" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Unsafe production folder: $production" >&2
            exit 2
          fi
          test -f "productions/$production/production.json"

      - name: Validate production
        run: node tools/validate-production.mjs "productions/$PRODUCTION/production.json"

      - name: Validate attention design
        run: node tools/validate-attention.mjs "productions/$PRODUCTION/production.json"

      - name: Typecheck and build
        run: npm run build

      - name: Render MP4
        run: npm run render -- "$PRODUCTION"

      - name: Verify rendered audio
        shell: bash
        run: |
          set -euo pipefail
          production="$PRODUCTION"
          production_id="$(node -p "require('./productions/${production}/production.json').meta.id")"
          output="outputs/${production_id}.mp4"
          test -s "$output"
          if node -e "const p=require('./productions/${production}/production.json'); process.exit(p.audio ? 0 : 1)"; then
            codec="$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=noprint_wrappers=1:nokey=1 "$output")"
            test "$codec" = "aac" || { echo "Rendered audio stream is missing" >&2; exit 1; }
            peak="$(ffmpeg -hide_banner -nostats -i "$output" -af volumedetect -f null - 2>&1 | sed -n 's/.*max_volume: \([-0-9.]*\) dB/\1/p')"
            awk -v peak="$peak" 'BEGIN { exit !(peak != "" && peak > -22) }' || { echo "Rendered audio is too quiet: ${peak} dB peak" >&2; exit 1; }
          fi

      - name: Build browser review package
        run: node tools/package-review.mjs "$PRODUCTION"

      - name: Upload render + review artifact
        uses: actions/upload-artifact@v4
        with:
          name: animation-${{ steps.resolve.outputs.production }}
          path: review-package/
          if-no-files-found: error
          retention-days: 90
