name: Market Shorts preview (no publishing)

on:
  workflow_dispatch:
    inputs:
      source:
        description: "synthetic = example preview, live = reviewed Keywords feed"
        type: choice
        required: true
        default: synthetic
        options:
          - synthetic
          - live
      idea_id:
        description: "Canonical idea ID; required for live source"
        type: string
        required: false
  repository_dispatch:
    types: [market_shorts_preview]

permissions:
  contents: read

concurrency:
  group: market-shorts-${{ github.event.client_payload.idea_id || inputs.idea_id || github.run_id }}
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MARKET_IDEAS_FEED_URL: ${{ vars.MARKET_IDEAS_FEED_URL }}
      MARKET_IDEAS_FEED_TOKEN: ${{ secrets.MARKET_IDEAS_FEED_TOKEN }}
      SOURCE: ${{ github.event_name == 'repository_dispatch' && 'live' || inputs.source }}
      IDEA_ID: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.idea_id || inputs.idea_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build production from reviewed source
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          if [ "$SOURCE" = "synthetic" ]; then
            node tools/market-shorts.mjs --input market-shorts/examples/synthetic-fixture.json
          elif [ "$SOURCE" = "live" ]; then
            test -n "$IDEA_ID" || { echo "Live runs require a canonical idea ID" >&2; exit 2; }
            test -n "$MARKET_IDEAS_FEED_URL" && test -n "$MARKET_IDEAS_FEED_TOKEN" || {
              echo "Configure read-only Keywords feed URL and token first" >&2; exit 2;
            }
            node tools/market-shorts.mjs --id "$IDEA_ID"
          else
            echo "Unknown source" >&2
            exit 2
          fi
      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          npx playwright install --with-deps chromium
      - name: Boot VOICEVOX Nemo
        shell: bash
        run: |
          set -euo pipefail
          docker pull voicevox/voicevox_nemo_engine:cpu-latest
          docker run -d --rm --name market-voicevox-nemo -p 127.0.0.1:50021:50121 voicevox/voicevox_nemo_engine:cpu-latest
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:50021/version >/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs market-voicevox-nemo || true
          exit 1
      - name: Validate + build + render
        env:
          PRODUCTION: ${{ steps.prepare.outputs.production }}
        shell: bash
        run: |
          set -euo pipefail
          node tools/validate-production.mjs "productions/$PRODUCTION/production.json"
          node tools/validate-attention.mjs "productions/$PRODUCTION/production.json"
          npm run build
          npm run render -- "$PRODUCTION"
          node tools/package-review.mjs "$PRODUCTION"
      - name: Attach video and experiment record (never upload to YouTube here)
        uses: actions/upload-artifact@v4
        with:
          name: market-shorts-preview-${{ steps.prepare.outputs.production }}
          path: |
            review-package/
            productions/${{ steps.prepare.outputs.production }}/experiment.json
            productions/${{ steps.prepare.outputs.production }}/production.json
          retention-days: 30
          if-no-files-found: error
