name: Market Shorts contract checks

on:
  pull_request:
    paths:
      - "tools/market-shorts*.mjs"
      - "market-shorts/**"
      - ".github/workflows/market-shorts-*.yml"
  push:
    branches: [main]
    paths:
      - "tools/market-shorts*.mjs"
      - "market-shorts/**"
      - ".github/workflows/market-shorts-*.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Smoke test idea eligibility and production schema
        run: node tools/market-shorts-smoke.mjs
