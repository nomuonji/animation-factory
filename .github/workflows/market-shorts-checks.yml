name: Market Shorts contract checks

on:
  pull_request:
    paths:
      - "tools/market-shorts*.mjs"
      - "tools/sound-bank*.mjs"
      - "tools/audio-pipeline.mjs"
      - "tools/validate-audio.mjs"
      - "tools/validate-attention.mjs"
      - "tools/validate-production.mjs"
      - "src/core/types.ts"
      - "src/runtime/Director.ts"
      - "schemas/production.schema.json"
      - "catalog/audio.json"
      - "catalog/components.json"
      - "catalog/asset-library.json"
      - "market-shorts/**"
      - ".github/workflows/market-shorts-*.yml"
  push:
    branches: [main]
    paths:
      - "tools/market-shorts*.mjs"
      - "tools/sound-bank*.mjs"
      - "tools/audio-pipeline.mjs"
      - "tools/validate-audio.mjs"
      - "tools/validate-attention.mjs"
      - "tools/validate-production.mjs"
      - "src/core/types.ts"
      - "src/runtime/Director.ts"
      - "schemas/production.schema.json"
      - "catalog/audio.json"
      - "catalog/components.json"
      - "catalog/asset-library.json"
      - "market-shorts/**"
      - ".github/workflows/market-shorts-*.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check local audio bank and sound decoding
        run: node tools/sound-bank-smoke.mjs
      - name: Install and typecheck
        run: |
          npm ci
          npm run build
      - name: Check adapter syntax
        run: |
          node --check tools/market-shorts.mjs
          node --check tools/market-shorts-upload.mjs
          node --check tools/market-shorts-analytics.mjs
      - name: Smoke test idea eligibility and production schema
        run: node tools/market-shorts-smoke.mjs
