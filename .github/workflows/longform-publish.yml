name: Publish approved long-form film
on:
  workflow_dispatch:
    inputs:
      production:
        description: Production ID
        required: true
      download_url:
        description: Temporary HTTPS URL of the approved final MP4 (masked in logs)
        required: true
      sha256:
        description: SHA256 of the approved final MP4
        required: true
      confirm:
        description: Type publish to confirm the owner's explicit publication request
        required: true
permissions:
  contents: read
concurrency:
  group: longform-publish-${{ inputs.production }}
  cancel-in-progress: false
jobs:
  publish:
    if: inputs.confirm == 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      PRODUCTION: ${{ inputs.production }}
      FILM_URL: ${{ inputs.download_url }}
      FILM_SHA: ${{ inputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Mask temporary download URL
        run: echo "::add-mask::$FILM_URL"
      - name: Verify existing channel ownership
        run: node tools/verify-ganbaru-channel.mjs
      - name: Upload exact approved MP4 and verify public visibility
        run: node tools/longform/publish.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: longform-publication-${{ inputs.production }}
          path: publication-receipt.json
          if-no-files-found: warn
          retention-days: 90
