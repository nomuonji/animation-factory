name: Photo-led Shorts checks

on:
  pull_request:
    paths:
      - "tools/fetch-licensed-photos.mjs"
      - "market-shorts/photo-bank/**"
      - "productions/museum-idea-shorts-20261017-02/**"
      - "src/main.ts"
      - "src/core/types.ts"
      - "src/core/validate.ts"
      - "src/styles.css"
      - "schemas/production.schema.json"
      - ".github/workflows/render-production.yml"
      - ".github/workflows/photo-shorts-checks.yml"

permissions:
  contents: read

jobs:
  photo-shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate photo-first production and rights metadata
        run: |
          node --check tools/fetch-licensed-photos.mjs
          node tools/validate-production.mjs productions/museum-idea-shorts-20261017-02/production.json
          node tools/validate-attention.mjs productions/museum-idea-shorts-20261017-02/production.json
      - name: Download and checksum genuine licensed photos
        run: |
          node tools/fetch-licensed-photos.mjs museum-idea-shorts-20261017-02
          test -s public/visuals/gold-face.jpg
          test -s public/visuals/gold-imprint.png
          test -s public/visuals/dogu-real.jpg
          test -s public/visuals/haniwa-large.jpg
          test -s public/visuals/haniwa-small.jpg
      - name: Typecheck and bundle
        run: npm run build
