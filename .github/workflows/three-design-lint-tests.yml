name: Three Shorts Ideation Gate Tests

on:
  pull_request:
    paths:
      - "tools/three/design-lint.mjs"
      - "tools/three/design-lint.test.mjs"
      - "tools/three/check-skit-pr-gate.mjs"
      - "templates/skit3d.json"
      - "docs/three-shorts-playbook.md"
      - "docs/short-drama-design.md"
  push:
    branches:
      - main
    paths:
      - "tools/three/design-lint.mjs"
      - "tools/three/design-lint.test.mjs"
      - "tools/three/check-skit-pr-gate.mjs"
      - "templates/skit3d.json"
      - "docs/three-shorts-playbook.md"
      - "docs/short-drama-design.md"

jobs:
  ideation-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: node --test tools/three/design-lint.test.mjs
      - name: Enforce evidence on every changed skit scene
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tools/three/check-skit-pr-gate.mjs
